# msgCTF 공통 규약 (노션 "API공통/참고" 문서 기준, 2026-07-28 확인)
# 팀 상대 비교가 아니라 이 문서에 명시된 '정답'과 명세를 직접 대조하는 절대 기준 검증에 쓰인다.
# harness/checks/contract.py 가 이 파일을 읽는다.
#
# envelope_keys/forbidden_terms는 원래 board/KOTH가 응답 envelope 미합의라 꺼둔 상태였다.
# 2026-08-16 로그인(/api/v1/auth/login), 마이페이지(/api/v1/teams/me, .../qr_token)를
# 직접 확인해 board/KOTH뿐 아니라 구현 완료된 API 전체가 이미 code/message/data를
# 일관되게 쓰고 있음을 확인해 다시 켠다.
envelope_keys: [code, message, data]
# tile은 확정 보드 규칙에서 cell로 통일한 옛 용어라 명세에 남아 있으면 안 된다.
forbidden_terms: [tile]

# 모든 경로가 이걸로 시작해야 함 (단, base_url_exceptions에 있는 접두어는 예외)
base_url: /api/v1
# /internal/** 은 채점 서버 전용 API로, 공개 /api/v1 네임스페이스와 의도적으로 분리한다고
# 명세에 명시되어 있음 (예: /internal/koth/scores)
# /healthz 는 DevSecOps 파이프라인(PR #1)의 배포 헬스체크 엔드포인트라 /api/v1 밖이다.
base_url_exceptions: [/internal, /healthz]

url_rules:
  no_trailing_slash: true
  # 리소스명 복수형 규칙 검사에서 예외로 둘 첫 세그먼트 (싱글턴/기능 도메인명이라 복수형이 안 맞음)
  resource_name_plural_skip: [me, auth, admin, internal, login, logout, refresh, board, koth, ranking, leaderboard, timer]

# instance_id는 규약 원문의 ID 타입 표에 없고, 실제 명세 전체가 스케줄러 발급 UUID 문자열을
# 일관되게 쓰고 있어 Long 목록에 넣지 않는다.
# team_id / club_id / koth_challenge_id는 2026-08-16 KOTH 템플릿 확정 반영으로 UUID 문자열이
# 되었다. 명세와 출제자 배포용 템플릿이 모두 UUID를 쓰므로 Long 목록에서 옮긴다.
# challenge_id도 2026-08-08 규약 개정으로 UUID 문자열이 됐다 (/api/v1/board/opened_challenges
# 문서에 명시: "challenge_id: String(UUID), 2026-08-08 규약 개정으로 UUID 문자열"). contract.yaml이
# 그 개정을 반영하지 못하고 있던 것을 여기서 맞춘다.
# user_id / history_id도 UUID 문자열이다 (강지원 확인, 2026-08-16). 이제 모든 id 필드가
# UUID 문자열이라 long_fields는 비운다.
id_types:
  long_fields: []
  string_fields: [card_id, team_card_id, discarded_team_card_id, kept_team_card_id, token, team_id, club_id, koth_challenge_id, challenge_id, user_id, history_id, instance_id, secret_id, secret_ref]

# 타임스탬프 필드는 ISO-8601 UTC (끝에 Z) 형식이어야 한다.
timestamp_must_be_iso_utc: true

# 성공 응답(Response 섹션)의 최상위 'code' 값은 이 값이어야 한다.
success_code_value: SUCCESS

# 허용되는 HTTP status code 목록
allowed_http_status: [200, 202, 400, 401, 403, 404, 405, 409, 429, 500, 503]

# leaf: JSON에서 실제로 등장하는 필드명(예: "type", "status")
# parents: 생략하면 leaf 이름만으로 전역 매칭 (role/difficulty/category 처럼 문맥 없이도 안전한 경우)
#          지정하면 해당 leaf가 이 상위 키(배열이면 배열의 키, 객체면 감싸는 객체의 키) 아래에 있을 때만 매칭
#          (예: "cells": [{"type": "START"}] -> leaf=type, parent=cells)
enum_rules:
  - leaf: role
    values: [PARTICIPANT, ADMIN]
  - leaf: difficulty
    values: [EASY, MEDIUM, HARD]
  - leaf: category
    values: [WEB, PWN, REV, CRYPTO, FORENSIC, MISC, WEB3, OSINT]
  - leaf: status
    parents: [instance, instances]
    values: [REQUESTED, SCHEDULING, PROVISIONING, RUNNING, RESTARTING, RESETTING, STOPPING, STOPPED, FAILED, EXPIRED, CLEANUP_PENDING, CLEANED]
  - leaf: type
    parents: [mileage, mileage_history, history]
    values: [CHALLENGE_SOLVE, START_BONUS, ROULETTE, KOTH_REWARD, ADMIN_GRANT, REFUND, PURCHASE, ADMIN_DEDUCT]
  - leaf: type
    parents: [cell, cells]
    values: [START, CHALLENGE, CHANCE, AIRPORT, ROULETTE]
  # KOTH 문제 공개 상태. 동아리가 아니라 문제 단위로 관리한다(한 동아리의 문제 둘이 서로 다른
  # open_group에 들어갈 수 있음).
  - leaf: status
    parents: [club, clubs, challenge, challenges]
    values: [SCHEDULED, ACTIVE, CLOSED]

# 공통 에러 코드: code 값이 이 목록에 있으면 http 값이 일치하는지 검증한다.
common_error_codes:
  - {http: 401, code: TOKEN_MISSING}
  - {http: 401, code: TOKEN_EXPIRED}
  - {http: 401, code: TOKEN_INVALID}
  - {http: 403, code: FORBIDDEN}
  - {http: 403, code: TEAM_BANNED}
  - {http: 400, code: INVALID_REQUEST}
  - {http: 404, code: USER_HAS_NO_TEAM}
  - {http: 403, code: NOT_TEAM_LEADER}
  - {http: 429, code: TOO_MANY_REQUESTS}
  - {http: 500, code: INTERNAL_ERROR}
  # 로그인/인증 (apps/accounts)
  - {http: 401, code: INVALID_CREDENTIALS}
  - {http: 401, code: REFRESH_TOKEN_EXPIRED}
  - {http: 401, code: REFRESH_TOKEN_INVALID}
  - {http: 401, code: REFRESH_TOKEN_NOT_FOUND}
  # 관리자 팀/밴 (apps/adminpanel)
  - {http: 404, code: TEAM_NOT_FOUND}
  - {http: 409, code: ALREADY_BANNED}
  - {http: 409, code: NOT_BANNED}
  # 관리자 마일리지 지급/차감 (apps/adminpanel, PR #13)
  - {http: 400, code: INVALID_AMOUNT}
  - {http: 400, code: INSUFFICIENT_MILEAGE}
  # 관리자 QR 결제/환불 (apps/adminpanel)
  - {http: 400, code: PAYMENT_TOKEN_EXPIRED}
  - {http: 400, code: PAYMENT_TOKEN_INVALID}
  - {http: 404, code: PAYMENT_NOT_FOUND}
  - {http: 409, code: ALREADY_REFUNDED}
  - {http: 409, code: NOT_REFUNDABLE}
  # 프레임워크 폴백
  - {http: 404, code: NOT_FOUND}
  - {http: 405, code: METHOD_NOT_ALLOWED}
  # 인스턴스 스케줄러 연동 (PR #8) — 외부 scheduler 미가용 시
  - {http: 503, code: SCHEDULER_UNAVAILABLE}
  # KOTH 동아리 조회와 문제별 리더보드 (PR #20, #55)
  - {http: 400, code: INVALID_CLUB_ID}
  - {http: 404, code: CLUB_NOT_FOUND}
  - {http: 400, code: KOTH_CHALLENGE_ID_REQUIRED}
  - {http: 400, code: INVALID_KOTH_CHALLENGE_ID}
  - {http: 404, code: KOTH_CHALLENGE_NOT_FOUND}
  # KOTH 내부 API 전용 (/internal/koth/scores, /internal/koth/team_tokens/verify, /internal/teams)
  - {http: 400, code: INVALID_PERIOD}
  - {http: 401, code: INVALID_INTERNAL_TOKEN}
  - {http: 409, code: PERIOD_NOT_READY}
  - {http: 500, code: SCORING_FAILED}
  # 플래그 제출 전용. team_tokens/verify는 인증 전 단계라 플랫폼이 차단하지 않으므로
  # 429를 반환하지 않는다 (admin.md "검증 제한 정책" 참고).
  - {http: 429, code: TOO_MANY_ATTEMPTS}
  # 문제 상세 / 플래그 제출 (challenge 앱, PR #8)
  - {http: 403, code: CHALLENGE_LOCKED}
  - {http: 404, code: CHALLENGE_NOT_FOUND}
  - {http: 409, code: ALREADY_SOLVED}
  # 인스턴스 (instances 앱, PR #8)
  - {http: 404, code: INSTANCE_NOT_FOUND}
  - {http: 400, code: INVALID_STATE_TRANSITION}
  - {http: 404, code: RUNTIME_CONFIG_NOT_FOUND}
  - {http: 400, code: HARD_TIMEOUT_EXCEEDED}
  # 관리자 인스턴스 강제 조작 (adminpanel, PR #22)
  - {http: 409, code: INSTANCE_ALREADY_TERMINATED}
  - {http: 409, code: INSTANCE_NOT_RESTARTABLE}
  # 인스턴스 생성 - 스케줄러가 4xx 로 반환해 프론트로 전달되는 코드 (instances 앱, PR #8)
  - {http: 400, code: INVALID_TTL_RANGE}
  - {http: 400, code: HARD_TIMEOUT_LIMIT_EXCEEDED}
  - {http: 409, code: ACTIVE_INSTANCE_EXISTS}
  - {http: 409, code: TEAM_INSTANCE_LIMIT_EXCEEDED}
  # 관리자 조정 멱등성 (adminpanel)
  - {http: 400, code: IDEMPOTENCY_KEY_REQUIRED}
  - {http: 409, code: IDEMPOTENCY_KEY_CONFLICT}
  # 관리자 계정 등록 (adminpanel)
  - {http: 409, code: LOGIN_ID_TAKEN}
  - {http: 409, code: TEAM_ALREADY_HAS_LEADER}
  # 문제 릴리스 관리 (/admin/challenges/{id}/releases)
  - {http: 400, code: RELEASE_INVALID}
  - {http: 400, code: RELEASE_NOT_DEPLOYABLE}
  - {http: 404, code: RELEASE_NOT_FOUND}
  - {http: 409, code: RELEASE_DUPLICATED}
  - {http: 400, code: RUNTIME_SECRET_INVALID}
  - {http: 404, code: RUNTIME_SECRET_NOT_FOUND}
  - {http: 503, code: RUNTIME_SECRET_UNAVAILABLE}
